name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 检查与测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 语法 + ShellCheck
        run: |
          bash -n init.sh tests/smoke.sh tests/audit.sh
          shellcheck --severity=warning init.sh tests/smoke.sh tests/audit.sh

      - name: 冒烟测试
        run: bash tests/smoke.sh

      - name: 全路径自检
        run: bash tests/audit.sh
