name: Cleanup old releases

# 临时工作流：删除仓库里所有旧的 Release 和 tag（用完就删掉这个文件）
# 触发方式：push 到 cleanup-releases 分支
on:
  push:
    branches:
      - cleanup-releases

permissions:
  contents: write

jobs:
  cleanup:
    name: 删除全部 Release 与 tag
    runs-on: ubuntu-24.04
    steps:
      - name: 删除
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          echo "=== 发布前状态 ==="
          gh release list --limit 200 || true

          echo "=== 删除所有 Release（连带 tag） ==="
          gh release list --limit 200 --json tagName --jq '.[].tagName' > /tmp/rel.txt || true
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            echo "删除 release: $t"
            gh release delete "$t" --yes --cleanup-tag || true
          done < /tmp/rel.txt

          echo "=== 删除仍然存在的 tag ==="
          gh api "repos/$REPO/git/refs/tags" --paginate --jq '.[].ref' 2>/dev/null | sed 's|refs/tags/||' > /tmp/tags.txt || true
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            echo "删除 tag: $t"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$t" || true
          done < /tmp/tags.txt

          echo "=== 清理后状态 ==="
          gh release list --limit 200 || true
          gh api "repos/$REPO/git/refs/tags" --jq '.[].ref' 2>/dev/null || echo "（已无 tag）"
