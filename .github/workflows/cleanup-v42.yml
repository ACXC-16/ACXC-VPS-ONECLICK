name: Cleanup releases

# 临时工作流：清掉现有 Release 和 tag，用于重新发布 V1.0.0（用完即删）
on:
  push:
    branches:
      - cleanup-v42

permissions:
  contents: write

jobs:
  cleanup:
    name: 删除全部 Release 与 tag
    runs-on: ubuntu-24.04
    steps:
      - name: 删除
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          gh release list --limit 200 || true
          gh release list --limit 200 --json tagName --jq '.[].tagName' > /tmp/rel.txt || true
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            echo "删除 release: $t"
            gh release delete "$t" --yes --cleanup-tag || true
          done < /tmp/rel.txt
          gh api "repos/$REPO/git/refs/tags" --paginate --jq '.[].ref' 2>/dev/null | sed 's|refs/tags/||' > /tmp/tags.txt || true
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            echo "删除 tag: $t"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$t" || true
          done < /tmp/tags.txt
          echo "=== 之后 ==="
          gh release list --limit 200 || true
