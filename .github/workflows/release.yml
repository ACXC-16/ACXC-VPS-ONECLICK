name: Release

# 打 v* 标签时自动发布（先测试，通过才发）。稳定下载地址：
#   https://github.com/ACXC-16/ACXC-VPS-ONECLICK/releases/latest/download/init.sh
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 测试并发布
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 测试（不通过就不发）
        run: |
          bash -n init.sh
          shellcheck --severity=warning init.sh
          bash tests/smoke.sh

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp init.sh "VPS-acxc16-${GITHUB_REF_NAME}.sh"
          sha256sum init.sh "VPS-acxc16-${GITHUB_REF_NAME}.sh" > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" \
            init.sh "VPS-acxc16-${GITHUB_REF_NAME}.sh" SHA256SUMS.txt \
            --title "ACXC16-VPS新机一键脚本 ${GITHUB_REF_NAME}" \
            --generate-notes
